name: WealthTrack Safe Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/wealthtrack-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify restricted permissions are absent
        run: |
          ! grep -R -E 'NotificationListenerService|BIND_NOTIFICATION_LISTENER_SERVICE|READ_SMS|READ_CONTACTS|QUERY_ALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - name: Build safe debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WealthTrack-Safe-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
