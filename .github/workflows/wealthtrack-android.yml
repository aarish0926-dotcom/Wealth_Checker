name: WealthTrack Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/wealthtrack-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack Android source
        run: mkdir -p android && base64 -d android/source.tar.xz.b64 | tar -xJ -C android
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload phone-installable APK
        uses: actions/upload-artifact@v4
        with:
          name: wealthtrack-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
